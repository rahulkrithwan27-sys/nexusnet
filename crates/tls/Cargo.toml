[package]
name = "nexusnet-tls"
description = "TLS 1.3 transport security and authenticated key exchange for NexusNet."
version.workspace = true
edition.workspace = true
# Deliberately higher than the workspace MSRV of 1.75. The modern TLS and
# cryptography ecosystem requires edition 2024, which needs 1.85. Confining that
# requirement to this crate keeps the rest of the workspace buildable on 1.75.
rust-version = "1.85"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
nexusnet-encryption = { workspace = true }
# `ring` rather than the default `aws-lc-rs`: it is pure Rust plus assembly and
# needs no C toolchain or cmake, which keeps builds reproducible across the
# platforms NexusNet targets.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
rustls-pki-types = "1"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing = { workspace = true }
webpki-roots = "0.26"

[dev-dependencies]
rcgen = "0.13"
tokio = { workspace = true, features = ["full"] }
# For the transport-integration test. A dev-dependency cycle (transport depends
# on tls; tls's tests depend on transport) is permitted by Cargo, unlike a
# normal-dependency cycle.
nexusnet-transport = { workspace = true, features = ["tls"] }
nexusnet-protocol = { workspace = true }
bytes = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
