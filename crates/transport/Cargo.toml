[package]
name = "nexusnet-transport"
description = "Transport-layer connectivity (TCP, UDP) for the NexusNet networking framework."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
default = []
# Enables TLS-secured connections via `nexusnet-tls`. This pulls in the modern
# TLS stack, which requires Rust 1.85 — hence a feature rather than a default.
# Without it, `nexusnet-transport` builds on the workspace MSRV of 1.75.
tls = ["dep:nexusnet-tls", "dep:nexusnet-encryption", "dep:rustls"]

[dependencies]
nexusnet-core = { workspace = true }
nexusnet-protocol = { workspace = true }
nexusnet-scheduler = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
nexusnet-tls = { workspace = true, optional = true }
nexusnet-encryption = { workspace = true, optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
criterion = { workspace = true }

[[example]]
name = "echo_server"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
