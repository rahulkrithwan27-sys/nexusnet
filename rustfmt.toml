# Rustfmt configuration for the NexusNet workspace.
#
# Only options stabilized on the stable toolchain are used here, so
# `cargo fmt --check` runs cleanly in CI without requiring nightly.

edition = "2021"
max_width = 100
tab_spaces = 4
hard_tabs = false
newline_style = "Unix"
use_small_heuristics = "Default"
reorder_imports = true
reorder_modules = true
merge_derives = true
use_field_init_shorthand = true
use_try_shorthand = true
