# Clippy configuration for the NexusNet workspace.
#
# The lint *levels* live in the root `Cargo.toml` under `[workspace.lints]`;
# this file only tunes individual lint behavior.

# Clippy reads each crate's `rust-version` from its `Cargo.toml` automatically
# (since Rust 1.73), so the minimum supported version is not set here. Setting it
# globally would override the per-crate value and, in particular, wrongly force
# the 1.85 `nexusnet-tls` crate down to the workspace's 1.75 — which is exactly
# the "MSRV differs" warning that override produced.

# Product, protocol, and library names that legitimately contain intra-word
# capitalization. Without this list, `clippy::doc_markdown` would flag every
# mention of them in doc comments as "missing backticks". The leading `".."`
# extends Clippy's built-in default list rather than replacing it.
doc-valid-idents = [
    "..",
    "NexusNet",
    "MessagePack",
    "ChaCha20",
    "ChaCha20-Poly1305",
    "Poly1305",
    "AES-GCM",
    "WebSocket",
    "T-digest",
]
